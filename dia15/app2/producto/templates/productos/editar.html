<!-- producto/templates/productos/editar.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de navegación / Encabezado -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'productos_list' %}">
                <i class="bi bi-box-seam me-2"></i>Gestión de Productos
            </a>
            <div class="ms-auto">
                <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
                </a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h5 class="card-title mb-0 fs-6 fw-bold">
                            <i class="bi bi-pencil-square me-2"></i>Editar Producto
                        </h5>
                    </div>
                    <div class="card-body p-4">

                        <form method="post" class="needs-validation" novalidate>
                            {% csrf_token %}

                            <!-- Código de barra -->
                            <div class="mb-3">
                                <label for="codigo_barra" class="form-label fw-semibold small">Código de barra</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="bi bi-barcode text-muted"></i></span>
                                    <input type="text" class="form-control" id="codigo_barra" name="codigo_barra" value="{{ producto.codigo_barra }}" required>
                                </div>
                            </div>

                            <!-- Descripción -->
                            <div class="mb-3">
                                <label for="descripcion" class="form-label fw-semibold small">Descripción</label>
                                <input type="text" class="form-control" id="descripcion" name="descripcion" value="{{ producto.descripcion }}" required>
                            </div>

                            <!-- Precios (Dos columnas) -->
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="precio_costo" class="form-label fw-semibold small">Precio Costo</label>
                                    <input type="number" step="0.01" class="form-control" id="precio_costo" name="precio_costo" value="{{ producto.precio_costo|stringformat:'.2f' }}" required>
                                </div>
                                <div class="col-6">
                                    <label for="precio_venta" class="form-label fw-semibold small">Precio Venta</label>
                                    <input type="number" step="0.01" class="form-control" id="precio_venta" name="precio_venta" value="{{ producto.precio_venta|stringformat:'.2f' }}" required>
                                </div>
                            </div>

                            <!-- IVA y Unidad de medida (Dos columnas) -->
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label for="iva" class="form-label fw-semibold small">IVA</label>
                                    <select class="form-select" id="iva" name="iva">
                                        <option value="EXENTO" {% if producto.iva == "EXENTO" %}selected{% endif %}>Exento</option>
                                        <option value="5" {% if producto.iva == "5" %}selected{% endif %}>5%</option>
                                        <option value="10" {% if producto.iva == "10" %}selected{% endif %}>10%</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label for="unidad_medida" class="form-label fw-semibold small">Unidad de medida</label>
                                    <input type="text" class="form-control" id="unidad_medida" name="unidad_medida" value="{{ producto.unidad_medida }}" placeholder="Ej: Unid, Kg..." required>
                                </div>
                            </div>

                            <!-- Stock -->
                            <div class="mb-4">
                                <label for="stock" class="form-label fw-semibold small">Stock disponible</label>
                                <input type="number" class="form-control" id="stock" name="stock" value="{{ producto.stock }}" required>
                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-flex justify-content-between align-items-center pt-2">
                                <a href="{% url 'productos_list' %}" class="btn btn-outline-secondary px-4 fw-semibold">
                                    <i class="bi bi-arrow-left me-1"></i>Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="bi bi-check-circle me-1"></i>Guardar cambios
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
